name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare project
        run: |
          unzip -q source.zip -d proj
          cp google-services.json proj/app/google-services.json
      - name: Build APK
        run: cd proj && gradle assembleDebug --no-daemon
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kishan Orders build ${{ github.run_number }}
          files: proj/app/build/outputs/apk/debug/app-debug.apk
